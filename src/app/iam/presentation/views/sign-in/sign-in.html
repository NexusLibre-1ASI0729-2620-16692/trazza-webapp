<section class="trazza-panel auth-card">
  <h1 class="mt-0 mb-1">{{ 'sign-in.title' | translate }}</h1>
  <p class="trazza-muted mt-0 mb-3">{{ 'sign-in.subtitle' | translate }}</p>
  <form [formGroup]="form" (ngSubmit)="submit()" class="stack">
    <mat-form-field appearance="outline">
      <mat-label>{{ 'fields.email' | translate }}</mat-label>
      <input matInput id="email" type="email" formControlName="email" autocomplete="username">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>{{ 'fields.password' | translate }}</mat-label>
      <input matInput id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password">
      <button mat-icon-button matSuffix type="button" (click)="showPassword.set(!showPassword())"
              [attr.aria-label]="(showPassword() ? 'sign-in.hide-password' : 'sign-in.show-password') | translate"
              [attr.aria-pressed]="showPassword()">
        <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </mat-form-field>
    <button mat-flat-button type="submit" [disabled]="store.processing()">{{ 'sign-in.submit' | translate }}</button>
  </form>
  <p class="mt-3 mb-0 center">
    {{ 'sign-in.no-account' | translate }}
    <a routerLink="/iam/sign-up" class="semibold">{{ 'sign-in.create-account' | translate }}</a>
  </p>
</section>
